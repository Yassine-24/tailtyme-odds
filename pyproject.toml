[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tailtyme-odds"
version = "0.1.0"
description = "Read-only Kalshi sports market odds lookup and normalization"
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "TailTyme" }]
dependencies = ["httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]
